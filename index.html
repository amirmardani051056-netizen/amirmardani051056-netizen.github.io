<style>
:root {
  --bg: #fff;
  --surface: #fff;
  --soft: #f7f7f7;
  --black: #111;
  --dark: #242424;
  --gray: #707070;
  --border: #e8e8e8;
  --shadow: 0 10px 35px rgba(0,0,0,.055);
  --radius: 17px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 100px; }
body {
  font-family: 'Vazirmatn', Tahoma, Arial, sans-serif;
  background: var(--bg);
  color: var(--black);
  line-height: 2;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
img { max-width: 100%; }
.container { width: min(1120px, 90%); margin: auto; }

/* HEADER */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255,255,255,.95);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
nav {
  min-height: 78px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}
.logo {
  font-size: 27px;
  font-weight: 800;
  letter-spacing: 1px;
  white-space: nowrap;
}
.logo span { color: #777; }
.nav-right { display: flex; align-items: center; gap: 23px; }
nav ul {
  display: flex;
  align-items: center;
  list-style: none;
  gap: 20px;
  flex-wrap: wrap;
}
nav ul a {
  color: #555;
  font-size: 13px;
  font-weight: 600;
  transition: .25s;
}
nav ul a:hover { color: #000; }

/* LANGUAGE SWITCH */
.language-switch {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px;
  border: 1px solid #ddd;
  border-radius: 30px;
  background: #fafafa;
  flex-shrink: 0;
}
.language-switch button {
  border: none;
  background: transparent;
  color: #777;
  padding: 6px 11px;
  border-radius: 22px;
  cursor: pointer;
  font-family: inherit;
  font-size: 11px;
  font-weight: 700;
  transition: .25s;
}
.language-switch button.active { background: #111; color: #fff; }

/* HERO */
.hero {
  min-height: unset;
  display: block;
  padding: 55px 0;
  background: linear-gradient(135deg, #ffffff 0%, #f5f7fa 100%);
  border-bottom: 1px solid var(--border);
}
.hero-layout {
  display: grid;
  grid-template-columns: 1fr 0.9fr;
  align-items: center;
  gap: 45px;
  direction: ltr;
}
.hero-content { padding: 45px 0; text-align: right; direction: rtl; }
html[dir="ltr"] .hero-content { text-align: left; direction: ltr; }
.eyebrow {
  display: inline-block;
  font-size: 12px;
  letter-spacing: 2px;
  color: #555;
  border: 1px solid #ddd;
  padding: 6px 17px;
  border-radius: 30px;
}
.hero h1 {
  font-size: clamp(38px, 5vw, 62px);
  font-weight: 800;
  line-height: 1.5;
  margin: 25px 0 15px;
}
.hero h1 span { color: #777; }
.hero-description {
  max-width: 550px;
  margin: 0;
  font-size: 15px;
  color: #666;
  line-height: 2.4;
}
.hero-buttons {
  display: flex;
  justify-content: flex-start;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 30px;
}

/* PROFILE IMAGE */
.hero-photo {
  width: 100%;
  height: 460px;
  overflow: hidden;
  border-radius: 22px;
  background: #e9edf2;
  box-shadow: 0 15px 45px rgba(0,0,0,.12);
}
.hero-photo img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  object-position: 73% center;
  transition: transform .5s ease;
}
.hero-photo:hover img { transform: scale(1.025); }

/* BUTTONS */
.btn {
  display: inline-block;
  padding: 11px 27px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 700;
  transition: .3s;
}
.btn-primary { background: #111; color: white; }
.btn-primary:hover { background: #444; transform: translateY(-3px); }
.btn-outline { border: 1px solid #222; color: #111; }
.btn-outline:hover { background: #eee; transform: translateY(-3px); }

/* GENERAL SECTIONS */
section { padding: 90px 0; }
.section-heading { text-align: center; margin-bottom: 48px; }
.section-heading h2 {
  font-size: 29px;
  font-weight: 800;
  margin-bottom: 8px;
}
.section-heading p { color: var(--gray); font-size: 13px; }
.section-line {
  width: 42px;
  height: 3px;
  background: #222;
  border-radius: 5px;
  margin: 17px auto 0;
}

/* ABOUT */
.about-box {
  max-width: 900px;
  margin: auto;
  padding: 38px;
  background: var(--soft);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.about-box p { color: #555; font-size: 14px; line-height: 2.5; }
.about-box p + p { margin-top: 15px; }

/* TIMELINE */
.timeline-section { background: var(--soft); }
.timeline {
  position: relative;
  max-width: 900px;
  margin: 55px auto 0;
}
.timeline::before {
  content: "";
  position: absolute;
  right: 19px;
  top: 15px;
  bottom: 15px;
  width: 2px;
  background: #d5d5d5;
}
.timeline-item {
  position: relative;
  padding-right: 65px;
  margin-bottom: 55px;
}
.timeline-item:last-child { margin-bottom: 0; }
.timeline-dot {
  position: absolute;
  right: 9px;
  top: 20px;
  width: 22px;
  height: 22px;
  border: 5px solid var(--soft);
  background: #111;
  border-radius: 50%;
  box-shadow: 0 0 0 2px #222;
  z-index: 2;
}
.timeline-card {
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: .35s;
}
.timeline-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 15px 40px rgba(0,0,0,.09);
}
.timeline-image {
  display: block;
  width: 100%;
  height: 240px;
  object-fit: contain;
  object-position: center;
  background: #f5f5f5;
  padding: 8px;
}
.image-fallback {
  display: none;
  width: 100%;
  height: 240px;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 10px;
  background: linear-gradient(135deg,#f0f0f0,#fafafa);
  color: #555;
}
.image-fallback strong { font-size: 18px; }
.image-fallback small { font-size: 12px; color: #888; }
.fallback-icon { font-size: 48px; color: #999; }
.timeline-content { padding: 28px; }
.timeline-date {
  display: inline-block;
  color: #888;
  font-size: 12px;
  margin-bottom: 8px;
}
.timeline-content h3 { font-size: 21px; margin-bottom: 10px; }
.timeline-content p { color: #666; font-size: 14px; line-height: 2.3; }
.timeline-tag {
  display: inline-block;
  margin: 14px 5px 0 0;
  padding: 5px 13px;
  border: 1px solid #ddd;
  border-radius: 30px;
  color: #555;
  font-size: 11px;
}

/* CARDS */
.grid {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 23px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px;
  box-shadow: 0 5px 22px rgba(0,0,0,.035);
  transition: .3s;
}
.card:hover {
  transform: translateY(-6px);
  box-shadow: var(--shadow);
  border-color: #aaa;
}
.card-number {
  color: #999;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
}
.card h3 { font-size: 18px; margin: 12px 0; }
.card p { color: #666; font-size: 13px; line-height: 2.3; }
.card-link {
  display: inline-block;
  color: #222;
  font-size: 13px;
  font-weight: 700;
  margin-top: 15px;
}
.card-link:hover { text-decoration: underline; }

/* ACHIEVEMENT & PROJECT LABELS */
.achievement-kicker,
.project-kicker {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  color: #555;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0;
  line-height: 1.8;
  margin-bottom: 9px;
}
.achievement-kicker::before,
.project-kicker::before {
  content: "";
  display: inline-block;
  width: 22px;
  height: 2px;
  border-radius: 4px;
  background: #777;
  flex-shrink: 0;
}
.achievement-card h3,
.project-card h3 { margin-top: 5px; }
.project-card {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}
.project-card .project-label { margin-top: 13px; margin-left: 5px; }
.project-card .project-label[data-i18n="project1Status"] {
  background: #f5f5f5;
  border-color: #d8d8d8;
  color: #333;
  font-weight: 700;
}
html[dir="ltr"] .achievement-kicker,
html[dir="ltr"] .project-kicker { letter-spacing: .15px; }

/* REFINED LABELS */
.achievement-kicker,
.project-kicker {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  color: #626262;
  font-size: 11px;
  font-weight: 700;
  line-height: 1.9;
  margin-bottom: 10px;
}
.achievement-kicker::before,
.project-kicker::before {
  content: "";
  display: inline-block;
  width: 23px;
  height: 2px;
  border-radius: 5px;
  background: #777;
  flex-shrink: 0;
}
.achievement-card h3,
.project-card h3 { margin-top: 4px; }

/* CONTACT */
.contact-section { background: var(--soft); }
.contact-box {
  max-width: 900px;
  margin: auto;
  padding: 38px;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.contact-box p {
  color: #555;
  font-size: 14px;
  line-height: 2.4;
}
.contact-items {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 18px;
  margin-top: 28px;
}
.contact-item {
  padding: 18px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #fafafa;
}
.contact-item strong {
  display: block;
  font-size: 13px;
  margin-bottom: 5px;
}
.contact-item a {
  color: #333;
  font-size: 14px;
  direction: ltr;
  display: inline-block;
}

/* FOOTER */
footer {
  padding: 28px 0;
  text-align: center;
  background: #111;
  color: #ddd;
  font-size: 12px;
}
footer p + p { margin-top: 5px; color: #999; }

/* SCROLL REVEAL */
.reveal {
  opacity: 0;
  transform: translateY(25px);
  transition: opacity .7s ease, transform .7s ease;
}
.reveal.visible { opacity: 1; transform: translateY(0); }

/* RESPONSIVE */
@media (max-width: 900px) {
  .hero-layout { grid-template-columns: 1fr 1fr; gap: 25px; }
  .hero-photo { height: 390px; }
  nav ul { gap: 12px; }
  .nav-right { gap: 14px; }
}
@media (max-width: 768px) {
  nav { padding: 12px 0; flex-direction: column; }
  .nav-right { width: 100%; justify-content: center; flex-wrap: wrap; }
  nav ul { justify-content: center; }
  .hero { padding: 25px 0 40px; }
  .hero-layout { grid-template-columns: 1fr; gap: 15px; }
  .hero-content { padding: 20px 0; text-align: center; }
  .hero-description { margin: auto; }
  .hero-buttons { justify-content: center; }
  .hero-photo { height: 360px; max-width: 470px; margin: auto; }
  section { padding: 65px 0; }
  .grid { grid-template-columns: 1fr; }
  .timeline-item { padding-right: 48px; }
  .timeline::before { right: 14px; }
  .timeline-dot { right: 4px; }
  .about-box, .contact-box { padding: 25px; }
  .contact-items { grid-template-columns: 1fr; }
}
@media (max-width: 480px) {
  .logo { font-size: 23px; }
  nav ul { gap: 10px; }
  nav ul a { font-size: 11px; }
  .hero h1 { font-size: 36px; }
  .hero-photo { height: 300px; }
  .section-heading h2 { font-size: 25px; }
  .timeline-content { padding: 20px; }
}

/* TYPOGRAPHY & ACCENT COLOR UPGRADE */
:root {
  --accent: #0f766e;
  --accent-dark: #115e59;
  --accent-soft: #e8f4f2;
}
.hero h1 { font-size: clamp(44px, 5.4vw, 68px); letter-spacing: -1.2px; }
.hero h1 span { color: var(--accent); }
.section-heading h2 {
  color: var(--accent-dark);
  font-size: clamp(31px, 3.2vw, 38px);
  line-height: 1.55;
}
.section-line { width: 58px; height: 4px; background: var(--accent); }
.card h3, .timeline-content h3 { font-size: 21px; line-height: 1.8; }
.achievement-kicker, .project-kicker {
  color: var(--accent-dark);
  font-size: 13px;
  font-weight: 800;
}
.achievement-kicker::before, .project-kicker::before {
  width: 28px;
  height: 3px;
  background: var(--accent);
}
.card:hover { border-color: rgba(15, 118, 110, .35); }
.card-link { color: var(--accent-dark); }
.btn-primary { background: var(--accent-dark); }
.btn-primary:hover { background: var(--accent); }
.btn-outline { border-color: var(--accent); color: var(--accent-dark); }
.btn-outline:hover { background: var(--accent-soft); }
.project-card .project-status,
.project-card .project-label[data-i18n="project1Status"] {
  color: var(--accent-dark);
  background: var(--accent-soft);
  border-color: #c8e4df;
}
@media (max-width: 768px) {
  .section-heading h2 { font-size: 28px; }
  .card h3, .timeline-content h3 { font-size: 19px; }
  .achievement-kicker, .project-kicker { font-size: 12px; }
}
</style>
